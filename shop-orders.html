<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mes commandes — TradeHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/config.js"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { primary: '#e8590c', 'primary-dark': '#c2410c', navy: '#0f1b2d' } } }
  }
</script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="bg-white border-b border-gray-200">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="index.html" class="font-display font-extrabold text-2xl text-navy">
      Trade<span class="text-primary">Hub</span>
    </a>
    <a href="shop-dashboard.html" class="text-sm text-gray-500 hover:text-primary">← Mon espace vendeur</a>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-8">
  <h1 class="font-display font-bold text-2xl text-navy mb-1">Commandes</h1>
  <p id="orders-count" class="text-sm text-gray-500 mb-6"></p>

  <div id="orders-list" class="space-y-4">
    <!-- injecté en JS -->
  </div>
</main>

<script src="js/shop-auth.js"></script>
<script>
  requireShopAuth();

  const money = (n) => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(n);

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function paymentBadge(status) {
    if (status === 'reported') {
      return `<span class="text-xs font-medium px-2.5 py-1 rounded-full bg-amber-100 text-amber-700">⏳ Paiement signalé</span>`;
    }
    return `<span class="text-xs font-medium px-2.5 py-1 rounded-full bg-gray-100 text-gray-500">En attente de paiement</span>`;
  }

  function orderCardHTML(order) {
    return `
      <div class="bg-white border border-gray-200 rounded-lg p-5" data-id="${order.id}">
        <div class="flex items-start justify-between gap-4 mb-3">
          <div>
            <p class="font-semibold text-navy">Commande #${String(order.id).padStart(6, '0')}</p>
            <p class="text-xs text-gray-400">${formatDate(order.created_at)}</p>
          </div>
          ${paymentBadge(order.payment_status)}
        </div>

        <div class="grid sm:grid-cols-2 gap-3 text-sm mb-3">
          <div>
            <p class="text-xs text-gray-500">Client</p>
            <p class="text-gray-800">${order.customer_name} · ${order.customer_email}</p>
          </div>
          <div>
            <p class="text-xs text-gray-500">Livraison</p>
            <p class="text-gray-800">${order.shipping_address}</p>
          </div>
        </div>

        <div class="border-t border-gray-100 pt-3 space-y-1">
          ${order.items.map((it) => `
            <div class="flex justify-between text-xs text-gray-600">
              <span>${it.product_name} × ${it.quantity}</span>
              <span>${money(it.unit_price * it.quantity)}</span>
            </div>
          `).join('')}
        </div>
        <div class="border-t border-gray-100 mt-2 pt-2 flex items-center justify-between">
          <p class="font-display font-bold text-navy text-sm">Montant pour toi : ${money(order.mySubtotal)}</p>
          ${order.payment_status === 'reported'
            ? `<button class="view-proof-btn text-xs px-3 py-1.5 border border-gray-300 rounded-md hover:border-navy hover:text-navy">Voir la preuve de paiement</button>`
            : ''}
        </div>
      </div>
    `;
  }

  async function viewProof(orderId, btn) {
    const originalText = btn.textContent;
    btn.textContent = 'Chargement...';
    btn.disabled = true;
    try {
      const session = getShopSession();
      const res = await fetch(`${BACKEND_URL}/api/orders/${orderId}/payment-proof`, {
        headers: { Authorization: `Bearer ${session.token}` },
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || 'Impossible de récupérer la preuve.');
      }
      const blob = await res.blob();
      window.open(URL.createObjectURL(blob), '_blank');
    } catch (err) {
      alert(err.message);
    } finally {
      btn.textContent = originalText;
      btn.disabled = false;
    }
  }

  async function loadOrders() {
    const list = document.getElementById('orders-list');
    try {
      const session = getShopSession();
      const res = await fetch(`${BACKEND_URL}/api/shops/me/orders`, {
        headers: { Authorization: `Bearer ${session.token}` },
      });
      const orders = await res.json();
      if (!res.ok) throw new Error(orders.error || 'Erreur lors du chargement.');

      document.getElementById('orders-count').textContent = `${orders.length} commande${orders.length > 1 ? 's' : ''}`;

      list.innerHTML = orders.length
        ? orders.map(orderCardHTML).join('')
        : `<p class="text-center text-gray-500 py-12">Aucune commande pour le moment.</p>`;

      list.querySelectorAll('.view-proof-btn').forEach((btn) => {
        const orderId = btn.closest('[data-id]').dataset.id;
        btn.addEventListener('click', () => viewProof(orderId, btn));
      });
    } catch (err) {
      list.innerHTML = `<p class="text-center text-red-500 py-12">${err.message}</p>`;
    }
  }

  loadOrders();
</script>
<script src="js/page-nav.js"></script>
</body>
</html>

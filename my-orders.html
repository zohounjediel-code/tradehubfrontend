<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mes commandes — TradeHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { primary: '#e8590c', 'primary-dark': '#c2410c', navy: '#0f1b2d' } } }
  }
</script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="bg-white border-b border-gray-200">
  <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="index.html" class="font-display font-extrabold text-2xl text-navy">
      Trade<span class="text-primary">Hub</span>
    </a>
    <div class="flex items-center gap-3">
      <a href="customer-account.html" class="text-sm text-gray-500 hover:text-primary" data-i18n="account.backToAccount">← Mon compte</a>
      <span id="lang-switcher-slot"></span>
    </div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-8">
  <h1 class="font-display font-bold text-2xl text-navy mb-6" data-i18n="orders.title">Mes commandes</h1>

  <div id="orders-content">
    <!-- injecté en JS -->
  </div>
</main>

<script src="js/customer-auth.js"></script>
<script>
  requireCustomerAuth();

  const DATE_LOCALES = { fr: 'fr-FR', en: 'en-GB', de: 'de-DE', es: 'es-ES' };
  const PRICE_LOCALES = { fr: 'fr-FR', en: 'en-GB', de: 'de-DE', es: 'es-ES' };
  function formatDate(iso) {
    return new Date(iso).toLocaleDateString(DATE_LOCALES[getLang()] || 'fr-FR', { day: '2-digit', month: 'long', year: 'numeric' });
  }
  function formatPrice(value) {
    return new Intl.NumberFormat(PRICE_LOCALES[getLang()] || 'fr-FR', { style: 'currency', currency: 'EUR' }).format(value);
  }

  function paymentBadge(status) {
    if (status === 'reported') {
      return `<span class="text-xs font-medium px-2.5 py-1 rounded-full bg-amber-100 text-amber-700">${t('orders.paymentReported')}</span>`;
    }
    return `<span class="text-xs font-medium px-2.5 py-1 rounded-full bg-red-50 text-red-600">${t('orders.paymentDue')}</span>`;
  }

  function orderCard(order) {
    return `
      <div class="bg-white border border-gray-200 rounded-lg p-5">
        <div class="flex items-center justify-between mb-3">
          <div>
            <p class="font-display font-bold text-navy">${t('orders.orderFrom', { date: formatDate(order.created_at) })}</p>
          </div>
          ${paymentBadge(order.payment_status)}
        </div>
        <div class="space-y-1.5 border-t border-gray-100 pt-3">
          ${order.items.map((it) => `
            <div class="flex justify-between text-sm">
              <span class="text-gray-700" data-i18n-source="${escapeHtml(it.product_name)}">${escapeHtml(it.product_name)}</span> × ${it.quantity}
              <span class="text-gray-500">${formatPrice(it.unit_price * it.quantity)}</span>
            </div>
          `).join('')}
        </div>
        <div class="flex justify-between border-t border-gray-100 mt-3 pt-3 font-display font-bold text-navy">
          <span>${t('orders.total')}</span>
          <span>${formatPrice(order.total)}</span>
        </div>
        ${order.payment_status !== 'reported' ? `
          <a href="confirmation.html?order=${order.id}" class="btn-primary block text-center py-2.5 rounded-md text-sm mt-3">${t('orders.finalizePayment')}</a>
        ` : ''}
      </div>
    `;
  }

  async function loadOrders() {
    const content = document.getElementById('orders-content');
    try {
      const session = getCustomerSession();
      const res = await fetch(`${BACKEND_URL}/api/orders/mine`, {
        headers: { Authorization: `Bearer ${session.token}` },
      });
      const orders = await res.json();
      if (!res.ok) throw new Error(orders.error || t('orders.loadError'));

      content.innerHTML = orders.length
        ? `<div class="space-y-4">${orders.map(orderCard).join('')}</div>`
        : `
          <div class="text-center py-16">
            <p class="text-5xl mb-4">📦</p>
            <p class="text-gray-600 mb-4">${t('orders.noOrders')}</p>
            <a href="index.html" class="btn-primary inline-block px-6 py-3 rounded-md text-sm">${t('orders.exploreCatalog')}</a>
          </div>
        `;
      translateDynamicNodes(content);
    } catch (err) {
      content.innerHTML = `<p class="text-center text-red-500 py-16">${err.message}</p>`;
    }
  }

  loadOrders();
  window.addEventListener('i18n:change', loadOrders);
</script>
<script src="js/page-nav.js"></script>
</body>
</html>

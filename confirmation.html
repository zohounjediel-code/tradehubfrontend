<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paiement de la commande — TradeHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { primary: '#e8590c', 'primary-dark': '#c2410c', navy: '#0f1b2d' } } }
  }
</script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="bg-white border-b border-gray-200">
  <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="index.html" class="font-display font-extrabold text-2xl text-navy">
      Trade<span class="text-primary">Hub</span>
    </a>
    <span id="lang-switcher-slot"></span>
  </div>
</header>

<main class="w-full max-w-3xl mx-auto px-4 py-12">
  <div id="confirmation-content">
    <!-- injecté en JS -->
  </div>
</main>

<script src="js/customer-auth.js"></script>
<script>
  const orderId = new URLSearchParams(window.location.search).get('order');
  const content = document.getElementById('confirmation-content');
  const PRICE_LOCALES = { fr: 'fr-FR', en: 'en-GB', de: 'de-DE', es: 'es-ES' };
  const money = (n) => new Intl.NumberFormat(PRICE_LOCALES[getLang()] || 'fr-FR', { style: 'currency', currency: 'EUR' }).format(n);

  async function fetchOrder() {
    const session = getCustomerSession();
    const res = await fetch(`${BACKEND_URL}/api/orders/${orderId}`, {
      headers: session?.token ? { Authorization: `Bearer ${session.token}` } : {},
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || t('confirmation.loadError'));
    return data;
  }

  function orderItemsHTML(order) {
    return `
      <div class="border-t border-gray-200 pt-3 space-y-2">
        ${order.items.map((it) => `
          <div class="flex justify-between text-sm">
            <span class="text-gray-700" data-i18n-source="${escapeHtml(it.product_name)}">${escapeHtml(it.product_name)}</span> × ${it.quantity}
            <span class="text-gray-600">${money(it.unit_price * it.quantity)}</span>
          </div>
        `).join('')}
      </div>
      <div class="border-t border-gray-200 mt-3 pt-3 flex justify-between font-display font-bold text-navy">
        <span>${t('confirmation.total')}</span>
        <span>${money(order.total)}</span>
      </div>
    `;
  }

  function copyableField(label, value) {
    const id = `copy-${label}-${Math.random().toString(36).slice(2, 8)}`;
    return `
      <div class="flex items-center justify-between gap-2 bg-gray-50 border border-gray-200 rounded-md px-3 py-2">
        <div class="min-w-0">
          <p class="text-xs text-gray-500">${label}</p>
          <p id="${id}" class="text-sm font-mono text-navy truncate">${value}</p>
        </div>
        <button type="button" class="copy-btn text-xs px-2 py-1 border border-gray-300 rounded-md text-gray-500 hover:text-navy shrink-0" data-target="${id}">${t('confirmation.copy')}</button>
      </div>
    `;
  }

  function shopPaymentCardHTML(shop) {
    return `
      <div class="bg-white border border-gray-200 rounded-lg p-5 space-y-3">
        <div class="flex items-center justify-between">
          <p class="font-semibold text-navy">${shop.shopName}</p>
          <p class="font-display font-bold text-primary">${money(shop.subtotal)}</p>
        </div>
        ${shop.iban ? `
          <div class="space-y-2">
            ${copyableField(t('confirmation.accountHolder'), shop.bankAccountHolder || shop.shopName)}
            ${copyableField('IBAN', shop.iban)}
            ${shop.bic ? copyableField('BIC / SWIFT', shop.bic) : ''}
          </div>
        ` : `
          <p class="text-sm text-amber-600 bg-amber-50 border border-amber-100 rounded-md p-3">
            ${t('confirmation.noRib')}
          </p>
        `}
      </div>
    `;
  }

  function wireCopyButtons() {
    content.querySelectorAll('.copy-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const text = document.getElementById(btn.dataset.target).textContent;
        try {
          await navigator.clipboard.writeText(text);
          const original = btn.textContent;
          btn.textContent = t('confirmation.copied');
          setTimeout(() => (btn.textContent = original), 1500);
        } catch {
          alert(t('confirmation.copyFail'));
        }
      });
    });
  }

  function renderPendingPayment(order) {
    const totalShopSubtotals = order.shops.reduce((sum, s) => sum + s.subtotal, 0);
    content.innerHTML = `
      <div class="text-center mb-8">
        <div class="text-5xl mb-4">📦</div>
        <h1 class="font-display font-bold text-2xl text-navy mb-2">${t('confirmation.registered', { name: order.customer_name.split(' ')[0] })}</h1>
        <p class="text-gray-600">${t('confirmation.payToProceed')}</p>
      </div>

      <div class="bg-white border border-gray-200 rounded-lg p-6 mb-6">
        <p class="text-sm text-gray-500 mb-3">${t('confirmation.deliverTo')}</p>
        <p class="text-sm text-gray-800 mb-4">${order.shipping_address}</p>
        ${orderItemsHTML(order)}
      </div>

      <h2 class="font-display font-bold text-navy mb-1">${t('confirmation.makePayment')}</h2>
      <p class="text-sm text-gray-500 mb-4">
        ${order.shops.length > 1
          ? t('confirmation.multiShopNote', { n: order.shops.length })
          : t('confirmation.singleShopNote', { amount: money(totalShopSubtotals) })}
      </p>
      <div class="space-y-4 mb-8">
        ${order.shops.map(shopPaymentCardHTML).join('') || `<p class="text-sm text-gray-500">${t('confirmation.noShop')}</p>`}
      </div>

      <div class="bg-white border border-gray-200 rounded-lg p-6">
        <h2 class="font-display font-bold text-navy mb-1">${t('confirmation.sendProof')}</h2>
        <p class="text-sm text-gray-500 mb-4">${t('confirmation.sendProofHint')}</p>

        <form id="proof-form" class="space-y-4">
          <input id="proof-input" name="proof" type="file" accept="image/png, image/jpeg, image/webp, application/pdf" required
            class="block w-full text-sm text-gray-600 file:mr-3 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-primary file:text-white file:text-sm hover:file:bg-primary-dark" />
          <p id="proof-error" class="hidden text-sm text-red-600"></p>
          <button type="submit" id="proof-submit-btn" class="btn-primary w-full py-3 rounded-md text-sm">
            ${t('confirmation.alreadyPaid')}
          </button>
        </form>
      </div>
    `;
    translateDynamicNodes(content);

    wireCopyButtons();

    document.getElementById('proof-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('proof-submit-btn');
      const errorEl = document.getElementById('proof-error');
      errorEl.classList.add('hidden');

      const file = document.getElementById('proof-input').files[0];
      if (!file) {
        errorEl.textContent = t('confirmation.selectFile');
        errorEl.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = t('checkout.sending');

      try {
        const session = getCustomerSession();
        const formData = new FormData();
        formData.append('proof', file);

        const res = await fetch(`${BACKEND_URL}/api/orders/${orderId}/payment-proof`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${session.token}` },
          body: formData,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || t('checkout.genericError'));

        await load(); // recharge la page dans son état "en attente de vérification"
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = t('confirmation.alreadyPaid');
      }
    });
  }

  function renderReportedPayment(order) {
    content.innerHTML = `
      <div class="text-center">
        <div class="text-5xl mb-4">⏳</div>
        <h1 class="font-display font-bold text-2xl text-navy mb-2">${t('confirmation.paidThanks')}</h1>

        <div class="bg-amber-50 border border-amber-100 rounded-lg p-4 text-sm text-amber-800 max-w-md mx-auto mb-6">
          ${t('confirmation.verifyNote')}
        </div>

        <div class="bg-white border border-gray-200 rounded-lg p-6 text-left max-w-md mx-auto">
          <p class="text-sm text-gray-500 mb-3">${t('confirmation.deliverTo')}</p>
          <p class="text-sm text-gray-800 mb-4">${order.shipping_address}</p>
          ${orderItemsHTML(order)}
        </div>
      </div>
    `;
    translateDynamicNodes(content);
  }

  async function load() {
    if (!orderId) {
      content.innerHTML = `<p class="text-gray-500 text-center">${t('confirmation.noOrder')}</p>`;
      return;
    }
    try {
      const order = await fetchOrder();
      if (order.payment_status === 'reported') {
        renderReportedPayment(order);
      } else {
        renderPendingPayment(order);
      }
    } catch (err) {
      content.innerHTML = `<p class="text-gray-500 text-center">${err.message}</p>`;
    }
  }

  load();
  window.addEventListener('i18n:change', load);
</script>
<script src="js/page-nav.js"></script>
</body>
</html>

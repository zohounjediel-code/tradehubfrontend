<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Boutique — Administration TradeHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/config.js"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { primary: '#e8590c', 'primary-dark': '#c2410c', navy: '#0f1b2d' } } }
  }
</script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="bg-navy text-white">
  <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="index.html" class="font-display font-extrabold text-xl">
      Trade<span class="text-primary">Hub</span> <span class="text-gray-400 font-normal text-sm">/ Admin</span>
    </a>
    <a href="admin-dashboard.html" class="text-sm text-gray-300 hover:text-white">← Retour à la liste</a>
  </div>
</header>

<main class="w-full max-w-2xl mx-auto px-4 py-8">
  <h1 id="page-title" class="font-display font-bold text-2xl text-navy mb-6">Ajouter une boutique</h1>

  <form id="shop-form" class="bg-white border border-gray-200 rounded-lg p-6 space-y-4">
    <div>
      <label class="text-sm text-gray-700 font-medium">Nom de la boutique *</label>
      <input required name="shopName" type="text"
        class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
    </div>

    <div id="email-field">
      <label class="text-sm text-gray-700 font-medium">Email *</label>
      <input required name="email" type="email"
        class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
      <p class="text-xs text-gray-400 mt-1">Sert d'identifiant de connexion pour la boutique.</p>
    </div>

    <div>
      <label class="text-sm text-gray-700 font-medium">Pays</label>
      <input name="country" type="text"
        class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
    </div>

    <div id="password-field">
      <label class="text-sm text-gray-700 font-medium">Mot de passe *</label>
      <input required name="password" type="password" minlength="6" placeholder="6 caractères minimum"
        class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
      <p id="password-hint" class="text-xs text-gray-400 mt-1"></p>
    </div>

    <label class="flex items-center gap-2 text-sm text-gray-700">
      <input name="verified" type="checkbox" class="rounded border-gray-300" />
      Boutique vérifiée
    </label>

    <div id="bank-section" class="hidden border-t border-gray-200 pt-4 space-y-4">
      <div>
        <h2 class="font-display font-bold text-navy text-sm">Coordonnées bancaires (RIB)</h2>
        <p class="text-xs text-gray-500 mt-1">🔒 Chiffrées avant d'être enregistrées.</p>
      </div>
      <div>
        <label class="text-sm text-gray-700 font-medium">Titulaire du compte</label>
        <input name="bankAccountHolder" type="text"
          class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
      </div>
      <div>
        <label class="text-sm text-gray-700 font-medium">IBAN</label>
        <div class="mt-1 flex gap-2">
          <input id="field-iban" name="iban" type="password"
            class="flex-1 border border-gray-300 rounded-md px-3 py-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-primary/40" />
          <button type="button" id="toggle-iban" class="px-3 border border-gray-300 rounded-md text-sm text-gray-500 hover:text-navy">👁</button>
        </div>
      </div>
      <div>
        <label class="text-sm text-gray-700 font-medium">BIC / SWIFT</label>
        <div class="mt-1 flex gap-2">
          <input id="field-bic" name="bic" type="password"
            class="flex-1 border border-gray-300 rounded-md px-3 py-2.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-primary/40" />
          <button type="button" id="toggle-bic" class="px-3 border border-gray-300 rounded-md text-sm text-gray-500 hover:text-navy">👁</button>
        </div>
      </div>
    </div>

    <p id="form-error" class="hidden text-sm text-red-600"></p>

    <div class="flex gap-3 pt-2">
      <button type="submit" id="submit-btn" class="btn-primary flex-1 py-3 rounded-md text-sm">
        Enregistrer
      </button>
      <a href="admin-dashboard.html" class="btn-outline flex-1 py-3 rounded-md text-sm text-center">Annuler</a>
    </div>
  </form>
</main>

<script src="js/admin-auth.js"></script>
<script>
  requireAdminAuth();

  const shopId = new URLSearchParams(window.location.search).get('id');
  const isEditMode = !!shopId;
  const form = document.getElementById('shop-form');
  const submitBtn = document.getElementById('submit-btn');
  const errorEl = document.getElementById('form-error');

  if (isEditMode) {
    document.getElementById('page-title').textContent = 'Modifier la boutique';
    document.title = 'Modifier la boutique — Administration TradeHub';

    // Le mot de passe devient optionnel (= réinitialisation) en édition.
    form.password.required = false;
    document.getElementById('password-hint').textContent = 'Laisse vide pour ne pas changer le mot de passe actuel.';

    // La section RIB n'a de sens qu'en modification (pas à la création)
    document.getElementById('bank-section').classList.remove('hidden');
  }

  // Bascule affichage/masquage IBAN et BIC
  function wireToggle(fieldId, buttonId) {
    const field = document.getElementById(fieldId);
    const btn = document.getElementById(buttonId);
    if (!btn) return;
    btn.addEventListener('click', () => {
      field.type = field.type === 'password' ? 'text' : 'password';
    });
  }
  wireToggle('field-iban', 'toggle-iban');
  wireToggle('field-bic', 'toggle-bic');

  async function loadExistingShop() {
    if (!isEditMode) return;
    try {
      const shop = await adminApiFetch(`/shops/${shopId}`);
      form.shopName.value = shop.shopName;
      form.email.value = shop.email;
      form.country.value = shop.country;
      form.verified.checked = !!shop.verified;
      form.bankAccountHolder.value = shop.bankAccountHolder;
      form.iban.value = shop.iban;
      form.bic.value = shop.bic;
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.remove('hidden');
      form.querySelectorAll('input, button').forEach((el) => (el.disabled = true));
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enregistrement...';

    try {
      if (isEditMode) {
        await adminApiFetch(`/shops/${shopId}`, {
          method: 'PUT',
          body: JSON.stringify({
            shopName: form.shopName.value.trim(),
            email: form.email.value.trim(),
            country: form.country.value.trim(),
            verified: form.verified.checked,
            newPassword: form.password.value || undefined,
            bankAccountHolder: form.bankAccountHolder.value.trim(),
            iban: form.iban.value.trim(),
            bic: form.bic.value.trim(),
          }),
        });
      } else {
        await adminApiFetch('/shops', {
          method: 'POST',
          body: JSON.stringify({
            shopName: form.shopName.value.trim(),
            email: form.email.value.trim(),
            password: form.password.value,
            country: form.country.value.trim(),
            verified: form.verified.checked,
          }),
        });
      }
      window.location.href = 'admin-dashboard.html';
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enregistrer';
    }
  });

  loadExistingShop();
</script>
<script src="js/page-nav.js"></script>
</body>
</html>

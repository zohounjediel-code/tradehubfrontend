<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Commande — TradeHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { primary: '#e8590c', 'primary-dark': '#c2410c', navy: '#0f1b2d' } } }
  }
</script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="bg-white border-b border-gray-200">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <a href="index.html" class="font-display font-extrabold text-2xl text-navy shrink-0">
      Trade<span class="text-primary">Hub</span>
    </a>
    <div class="flex items-center gap-3 shrink-0">
      <p class="hidden sm:block text-xs text-gray-500" data-i18n="checkout.secureStep">🔒 Paiement sécurisé — Étape 2/2</p>
      <span id="lang-switcher-slot"></span>
    </div>
  </div>
</header>

<main class="w-full max-w-5xl mx-auto px-4 py-8">
  <h1 class="font-display font-bold text-2xl text-navy mb-6" data-i18n="checkout.title">Finaliser la commande</h1>

  <div id="checkout-content" class="grid md:grid-cols-3 gap-8">
    <!-- injecté en JS -->
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/ui.js"></script>
<script src="js/customer-auth.js"></script>
<script>
  async function render() {
    const content = document.getElementById('checkout-content');

    // Un compte client est désormais requis pour passer commande.
    const session = getCustomerSession();
    if (!session?.token) {
      content.innerHTML = `
        <div class="md:col-span-3 text-center py-20">
          <p class="text-5xl mb-4">🔒</p>
          <p class="text-gray-600 mb-2">${t('checkout.mustLogin')}</p>
          <p class="text-sm text-gray-400 mb-6">${t('checkout.itemsWaiting')}</p>
          <div class="flex gap-3 justify-center">
            <a href="login-shop.html" class="btn-primary inline-block px-6 py-3 rounded-md text-sm">${t('nav.login')}</a>
            <a href="register-customer.html" class="btn-outline inline-block px-6 py-3 rounded-md text-sm">${t('nav.createAccount')}</a>
          </div>
        </div>
      `;
      return;
    }

    const cart = await getCart();

    if (cart.length === 0) {
      content.innerHTML = `
        <div class="md:col-span-3 text-center py-20">
          <p class="text-gray-600 mb-4">${t('checkout.emptyCart')}</p>
        </div>
      `;
      return;
    }

    const total = await getCartTotal();
    const count = await getCartCount();

    content.innerHTML = `
      <form id="checkout-form" class="md:col-span-2 bg-white border border-gray-200 rounded-lg p-6 space-y-4">
        <h2 class="font-display font-bold text-navy mb-2">${t('checkout.deliveryInfo')}</h2>

        <div class="bg-gray-50 border border-gray-200 rounded-md p-3 text-sm text-gray-600">
          ${t('checkout.orderFor', { name: session.customer.name, email: session.customer.email })}
        </div>

        <div>
          <label class="text-sm text-gray-700 font-medium">${t('checkout.phone')}</label>
          <input name="phone" type="tel" class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40" />
        </div>
        <div>
          <label class="text-sm text-gray-700 font-medium">${t('checkout.address')}</label>
          <textarea required name="address" rows="3" placeholder="${t('checkout.addressPlaceholder')}"
            class="mt-1 w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40"></textarea>
        </div>

        <p id="form-error" class="hidden text-sm text-red-600"></p>

        <button type="submit" id="submit-btn" class="btn-primary w-full py-3 rounded-md text-sm mt-2">
          ${t('checkout.confirmOrder', { total: formatPrice(total) })}
        </button>
      </form>

      <div class="bg-white border border-gray-200 rounded-lg p-5 h-fit">
        <h2 class="font-display font-bold text-navy mb-4">${t('checkout.summary', { n: count })}</h2>
        <div class="space-y-3 max-h-72 overflow-y-auto pr-1">
          ${cart.map(i => `
            <div class="flex gap-3 text-sm">
              <div class="w-12 h-12 rounded border border-gray-200 bg-gray-100 overflow-hidden shrink-0">
                ${productImageHTML(i.image, i.name, 'w-full h-full object-cover')}
              </div>
              <div class="flex-1">
                <p class="text-gray-700 line-clamp-2" data-i18n-source="${escapeHtml(i.name)}">${escapeHtml(i.name)}</p>
                <p class="text-xs text-gray-400">${t('checkout.qty', { n: i.quantity })}</p>
              </div>
              <p class="text-gray-700 font-medium">${formatPrice(i.price * i.quantity)}</p>
            </div>
          `).join('')}
        </div>
        <div class="border-t border-gray-200 mt-4 pt-4 flex justify-between font-display font-bold text-navy">
          <span>${t('checkout.total')}</span>
          <span>${formatPrice(total)}</span>
        </div>
      </div>
    `;
    translateDynamicNodes(content);

    document.getElementById('checkout-form').addEventListener('submit', handleSubmit);
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const form = e.target;
    const submitBtn = document.getElementById('submit-btn');
    const errorEl = document.getElementById('form-error');
    errorEl.classList.add('hidden');

    const cartItems = await getCart();
    const items = cartItems.map(i => ({
      productId: i.productId,
      name: i.name,
      price: i.price,
      quantity: i.quantity,
    }));

    submitBtn.disabled = true;
    submitBtn.textContent = t('checkout.sending');

    try {
      const session = getCustomerSession();
      const res = await fetch(`${BACKEND_URL}/api/orders`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${session.token}`,
        },
        body: JSON.stringify({
          phone: form.phone.value.trim(),
          address: form.address.value.trim(),
          items,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || t('checkout.genericError'));

      await clearCart();
      window.location.href = `confirmation.html?order=${data.orderId}`;
    } catch (err) {
      errorEl.textContent = err.message || t('checkout.genericErrorRetry');
      errorEl.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.textContent = t('checkout.confirmOrderPlain');
    }
  }

  render();
  window.addEventListener('i18n:change', render);
</script>
<script src="js/page-nav.js"></script>
</body>
</html>

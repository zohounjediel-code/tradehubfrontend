<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Messages — Administration TradeHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/config.js"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { primary: '#e8590c', 'primary-dark': '#c2410c', navy: '#0f1b2d' } } }
  }
</script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="bg-navy text-white">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
    <a href="index.html" class="font-display font-extrabold text-xl">
      Trade<span class="text-primary">Hub</span> <span class="text-gray-400 font-normal text-sm">/ Admin</span>
    </a>
    <a href="admin-dashboard.html" class="text-sm text-gray-300 hover:text-white">← Comptes boutique</a>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-8">
  <h1 class="font-display font-bold text-2xl text-navy mb-1">Messages reçus</h1>
  <p id="messages-count" class="text-sm text-gray-500 mb-6"></p>

  <div id="messages-list" class="space-y-3">
    <!-- injecté en JS -->
  </div>
</main>

<script src="js/admin-auth.js"></script>
<script>
  requireAdminAuth();

  function formatDate(iso) {
    return new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function messageCard(m) {
    return `
      <div class="bg-white border ${m.is_read ? 'border-gray-200' : 'border-primary'} rounded-lg p-4" data-id="${m.id}">
        <div class="flex items-start justify-between gap-4">
          <div>
            <p class="font-medium text-navy">${m.name} ${m.is_read ? '' : '<span class="ml-1 inline-block w-2 h-2 rounded-full bg-primary"></span>'}</p>
            <p class="text-xs text-gray-500">${m.email} · ${formatDate(m.created_at)}</p>
          </div>
          ${!m.is_read ? `<button class="mark-read-btn text-xs px-3 py-1.5 border border-gray-300 rounded-md hover:border-navy hover:text-navy shrink-0">Marquer comme lu</button>` : ''}
        </div>
        <p class="text-sm text-gray-700 mt-3 whitespace-pre-wrap">${m.message}</p>
      </div>
    `;
  }

  async function loadMessages() {
    const list = document.getElementById('messages-list');
    try {
      const session = getAdminSession();
      const res = await fetch(`${BACKEND_URL}/api/contact`, {
        headers: { Authorization: `Bearer ${session.token}` },
      });
      const messages = await res.json();
      if (!res.ok) throw new Error(messages.error || 'Erreur lors du chargement.');

      document.getElementById('messages-count').textContent = `${messages.length} message${messages.length > 1 ? 's' : ''}`;

      list.innerHTML = messages.length
        ? messages.map(messageCard).join('')
        : `<p class="text-center text-gray-500 py-12">Aucun message pour le moment.</p>`;

      list.querySelectorAll('.mark-read-btn').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          const card = e.target.closest('[data-id]');
          const id = card.dataset.id;
          try {
            const putRes = await fetch(`${BACKEND_URL}/api/contact/${id}/read`, {
              method: 'PUT',
              headers: { Authorization: `Bearer ${session.token}` },
            });
            if (!putRes.ok) throw new Error('Impossible de marquer comme lu.');
            loadMessages();
          } catch (err) {
            alert(err.message);
          }
        });
      });
    } catch (err) {
      list.innerHTML = `<p class="text-center text-red-500 py-12">${err.message}</p>`;
    }
  }

  loadMessages();
</script>
<script src="js/page-nav.js"></script>
</body>
</html>
